name: Build and Push to GHCR

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract tag name
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch image with buildah
        run: |
          buildah bud \
            --platform linux/amd64,linux/arm64 \
            --manifest ghcr.io/${{ github.repository_owner }}/xray-reality:${{ steps.meta.outputs.tag }} \
            .

      - name: Push to GHCR
        run: |
          buildah manifest push --all \
            ghcr.io/${{ github.repository_owner }}/xray-reality:${{ steps.meta.outputs.tag }} \
            docker://ghcr.io/${{ github.repository_owner }}/xray-reality:${{ steps.meta.outputs.tag }}
